<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP39 has moved to ap39.site</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://ap39.site/repo">
<meta http-equiv="refresh" content="0; url=https://ap39.site/repo">
<script>
  // Keep the path, query and hash when forwarding to the new domain.
  var p = location.pathname; while (p.length > 1 && p.slice(-1) === "/") p = p.slice(0, -1);
  location.replace("https://ap39.site" + p + location.search + location.hash);
</script>
